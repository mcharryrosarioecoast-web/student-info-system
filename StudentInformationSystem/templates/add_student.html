{% extends "base.html" %}

{% block title %}
Add Student | Student Information System
{% endblock %}

{% block page_title %}
Add Student
{% endblock %}

{% block content %}

<div class="form-card">

    <div class="form-header">

        <h2>
            Student Information
        </h2>

        <p>
            Enter the student's information below.
        </p>

    </div>


    <form
        action="{{ url_for('add_student') }}"
        method="POST"
    >

        <div class="form-grid">

            <div class="form-group">

                <label>
                    Student ID
                </label>

                <input
                    type="text"
                    name="student_id"
                    placeholder="Example: U2401009"
                    value="{{ student.student_id }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    First Name
                </label>

                <input
                    type="text"
                    name="first_name"
                    placeholder="Enter first name"
                    value="{{ student.first_name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Last Name
                </label>

                <input
                    type="text"
                    name="last_name"
                    placeholder="Enter last name"
                    value="{{ student.last_name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Age
                </label>

                <input
                    type="number"
                    name="age"
                    min="1"
                    max="100"
                    placeholder="Enter age"
                    value="{{ student.age }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Gender
                </label>

                <select
                    name="gender"
                    required
                >

                    <option value="">
                        Select gender
                    </option>

                    <option
                        value="Male"
                        {% if student.gender == "Male" %}
                        selected
                        {% endif %}
                    >
                        Male
                    </option>

                    <option
                        value="Female"
                        {% if student.gender == "Female" %}
                        selected
                        {% endif %}
                    >
                        Female
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Course
                </label>

                <select
                    name="course"
                    required
                >

                    <option value="">
                        Select course
                    </option>

                    <option
                        value="BS Information Technology"
                        {% if student.course == "BS Information Technology" %}
                        selected
                        {% endif %}
                    >
                        BS Information Technology
                    </option>

                    <option
                        value="BS Computer Science"
                        {% if student.course == "BS Computer Science" %}
                        selected
                        {% endif %}
                    >
                        BS Computer Science
                    </option>

                    <option
                        value="BS Information Systems"
                        {% if student.course == "BS Information Systems" %}
                        selected
                        {% endif %}
                    >
                        BS Information Systems
                    </option>

                    <option
                        value="BS Business Administration"
                        {% if student.course == "BS Business Administration" %}
                        selected
                        {% endif %}
                    >
                        BS Business Administration
                    </option>

                    <option
                        value="Other"
                        {% if student.course == "Other" %}
                        selected
                        {% endif %}
                    >
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Year Level
                </label>

                <select
                    name="year_level"
                    required
                >

                    <option value="">
                        Select year level
                    </option>

                    <option
                        value="1st Year"
                        {% if student.year_level == "1st Year" %}
                        selected
                        {% endif %}
                    >
                        1st Year
                    </option>

                    <option
                        value="2nd Year"
                        {% if student.year_level == "2nd Year" %}
                        selected
                        {% endif %}
                    >
                        2nd Year
                    </option>

                    <option
                        value="3rd Year"
                        {% if student.year_level == "3rd Year" %}
                        selected
                        {% endif %}
                    >
                        3rd Year
                    </option>

                    <option
                        value="4th Year"
                        {% if student.year_level == "4th Year" %}
                        selected
                        {% endif %}
                    >
                        4th Year
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="student@example.com"
                    value="{{ student.email }}"
                    required
                >

            </div>

        </div>


        <div class="form-actions">

            <a
                href="{{ url_for('dashboard') }}"
                class="btn btn-light"
            >
                Cancel
            </a>

            <button
                type="submit"
                class="btn btn-primary"
            >
                Save Student
            </button>

        </div>

    </form>

</div>

{% endblock %}
